<dialog id="tools-dialog" data-widget aria-labelledby="tools-title"><div class="dialog-top"><h2 id="tools-title">轮盘与提醒</h2><button id="tools-close" class="round" aria-label="关闭工具">×</button></div><div class="tools-content"><section><h3>鱼群提醒</h3><label>提醒内容<input id="alarm-label" maxlength="100" value="看看鱼，休息一下"></label><label>倒计时（秒）<input id="alarm-seconds" type="number" min="1" max="604800" value="900"></label><div class="tool-checks"><label><input id="alarm-repeat" type="checkbox">完成后重新计时</label><label><input id="alarm-animation" type="checkbox" checked>鱼群围圈与闪边</label><label><input id="alarm-notify" type="checkbox">系统静音通知</label><label><input id="alarm-strong" type="checkbox">到点显示工具窗口</label><label><input id="alarm-quiet" type="checkbox">勿扰（不聚鱼、不通知、不抢焦点）</label></div><p id="alarm-status" role="status"></p><div class="tool-actions"><button id="alarm-start" class="primary">开始提醒</button><button id="alarm-pause" class="secondary">暂停</button><button id="alarm-cancel" class="secondary">取消</button></div><p class="fine">休眠或关闭期间错过的提醒，唤醒或重开后只保留一次待完成提醒；循环从投喂或点击完成时重新计时，不补发多次。</p></section><section id="wheel-settings"><h3>系统快捷轮盘</h3><p>轮盘配置正在接入；单独 Option 需要辅助功能授权，不会自动开启系统权限。</p></section><section><h3>动态与能耗</h3><label>观赏档<select id="power-mode"><option value="energy">节能 · 15 FPS</option><option value="balanced">均衡 · 30 FPS</option><option value="smooth">流畅 · 60 FPS</option></select></label><label><input id="power-reduced" type="checkbox">减少动态（前景和水体停止动态，不聚鱼闪边）</label><label>其他应用全屏时<select id="power-fullscreen"><option value="slow">降至 5 FPS</option><option value="pause">暂停</option><option value="off">不调整</option></select></label><p id="power-status" class="fine">全屏检测尚未连接系统事件；不会把窗口隐藏当作全屏。</p></section><p id="tools-status" role="status"></p></div></dialog><aside id="alarm-bubble" data-widget hidden role="status"><span class="alarm-icon">◷</span><div><strong id="alarm-bubble-label"></strong><small id="alarm-bubble-detail"></small></div><button id="alarm-complete">完成</button></aside>
